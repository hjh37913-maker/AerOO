name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Locate project
        id: loc
        run: |
          if [ -f settings.gradle ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            unzip -q project.zip -d _src
            echo "dir=_src/AeroBrowser" >> "$GITHUB_OUTPUT"
          fi

      - name: Build debug APK
        working-directory: ${{ steps.loc.outputs.dir }}
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: aero-debug-apk
          path: ${{ steps.loc.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
